# Opens a pull request when a dependency has a newer version, and straight away
# when one has a published vulnerability.
#
# The two the scanner found (js-yaml and sharp) had both been fixed upstream
# for a while and nothing here was watching. This is what notices the next one
# without anyone reading a dashboard.
#
# Weekly rather than daily, and updates grouped into one pull request, because
# CI runs on each and a pull request per package is noise nobody reads. Security
# updates ignore the schedule and the grouping.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything that is not a breaking change in one pull request: they are
      # reviewed by whether CI passes, not one by one.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # `@types/node` describes the runtime, so it follows the Node the project
      # actually runs and not the newest release. A major ahead of the runtime
      # describes APIs that are not there, and nothing catches it: the types
      # compile and the call fails when it runs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The workflows pin their actions by commit, so a moved tag is not picked up
  # on its own and this is what proposes the new commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All of them in one pull request, majors included. Left ungrouped the
      # first run opened four, one per action, for what is a line each. An
      # action's major is usually its runner's Node version, and they are
      # pinned by commit anyway, so they are read together or not at all.
      actions:
        patterns: ['*']
